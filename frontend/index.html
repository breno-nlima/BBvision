<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>BBVision - Fiscalização Remota de Obras | Banco do Brasil</title>
  <meta name="description" content="BBVision - Sistema Inteligente de Fiscalização e Monitoramento Remoto de Obras do Banco do Brasil com IA BBVision, Fé Pública e Inviolabilidade Criptográfica SHA-256.">
  <meta name="theme-color" content="#003882">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BBVision">
  
  <!-- Manifest Oficial PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon e Ícones Oficiais BBVision -->
  <link rel="icon" type="image/png" href="src/assets/logo.png">
  <link rel="apple-touch-icon" href="src/assets/logo.png">
  
  <!-- Tipografia Oficial: Plus Jakarta Sans (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Folhas de Estilo do Design System BBVision (v2.0 Produção) -->
  <link rel="stylesheet" href="src/styles/variables.css?v=2.0">
  <link rel="stylesheet" href="src/styles/base.css?v=2.0">
  <link rel="stylesheet" href="src/styles/components.css?v=2.0">
  <link rel="stylesheet" href="src/styles/screens.css?v=2.0">
</head>
<body>

  <!-- Barra Superior Corporativa Oficial (Banco do Brasil) -->
  <header class="bb-navbar" id="appNavbar">
    <div class="bb-navbar-brand" id="navBrandLogo">
      <div class="bb-navbar-logo-wrap">
        <img src="src/assets/logo.png" alt="BBVision" class="bb-navbar-logo">
      </div>
      <div class="bb-navbar-titles">
        <span class="bb-navbar-title">BBVision</span>
        <span class="bb-navbar-sub">Banco do Brasil S.A. • Fiscalização de Obras</span>
      </div>
    </div>

    <!-- Navegação Central da Aplicação -->
    <nav class="bb-navbar-nav" id="mainNavigationLinks">
      <button class="bb-nav-link" id="navLinkInicio">
        <img src="src/assets/icons/icone_inicio.png" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle;" alt="Início" /> Início
      </button>
      <button class="bb-nav-link" id="navLinkObras">
        <img src="src/assets/icons/icone_obras.png" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle;" alt="Obras" /> Obras
      </button>
      <button class="bb-nav-link" id="navLinkRelatorios">
        <img src="src/assets/icons/icone_relatorio.png" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle;" alt="Relatórios" /> Relatórios
      </button>
      <button class="bb-nav-link highlight-gov" id="navLinkValidador">
        <span>🛡️</span> Validar Fé Pública
      </button>
    </nav>

    <!-- Área de Usuário / Acesso à Direita -->
    <div class="bb-navbar-user-area" id="navbarUserArea">
      <!-- Injetado dinamicamente via script de autenticação -->
    </div>
  </header>

  <!-- Viewport Principal da Aplicação -->
  <main class="bb-app-main">
    <div class="app-screen-container" id="appScreenContainer">
      <!-- Telas injetadas dinamicamente via app.js -->
    </div>

    <!-- Barra Inferior de Navegação Móvel (Mobile Only) -->
    <div id="bottomNavSlot"></div>
  </main>

  <!-- Script Principal da Aplicação -->
  <script type="module" src="src/app.js"></script>

  <!-- Sincronização da Navbar com o Estado de Autenticação -->
  <script type="module">
    import { state } from './src/services/state.js';
    import { modal } from './src/components/modal.js';
    import { toast } from './src/components/toast.js';
    import { Icons } from './src/assets/icons.js';

    function sincronizarNavbar(s) {
      const user = s.user;
      const userArea = document.getElementById('navbarUserArea');
      const navLinks = document.getElementById('mainNavigationLinks');
      const page = s.currentPage;

      // Atualiza links ativos
      document.querySelectorAll('.bb-nav-link').forEach(btn => btn.classList.remove('active'));
      if (page === 'inicio') document.getElementById('navLinkInicio')?.classList.add('active');
      if (page === 'obras' || page === 'obra-detalhe') document.getElementById('navLinkObras')?.classList.add('active');
      if (page === 'relatorios' || page === 'relatorio-bloqueado') document.getElementById('navLinkRelatorios')?.classList.add('active');
      if (page === 'validador-publico') document.getElementById('navLinkValidador')?.classList.add('active');

      if (user) {
        if (navLinks) navLinks.style.display = 'flex';
        const isFiscal = user.cargo === 'fiscal';
        const roleLabel = isFiscal ? 'Fiscal BB' : 'Empreiteira';
        const avatarUrl = user.avatar || (isFiscal
          ? 'src/assets/icons/perfil_bb.png'
          : 'src/assets/icons/perfil_obras.png');

        userArea.innerHTML = `
          ${isFiscal ? `
            <button class="bb-nav-link" id="btnNavNovaObra" style="background: rgba(254, 211, 4, 0.18); color: #FED304; border: 1px solid rgba(254, 211, 4, 0.45); border-radius: var(--radius-full); padding: 5px 12px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;" title="Cadastrar Nova Obra (Exclusivo Fiscal BB)">
              <img src="src/assets/icons/icone_cadastro.png" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle;" alt="Nova Obra" /> Nova Obra
            </button>
          ` : ''}
          <div class="bb-user-profile-badge" id="btnNavUserProfile" title="Ver Perfil de ${user.nome}">
            <img src="${avatarUrl}" alt="${user.nome}" class="bb-user-avatar">
            <div class="bb-user-info">
              <span class="bb-user-name">${user.nome.split(' ')[0]}</span>
              <span class="bb-user-role ${isFiscal ? 'fiscal' : 'empreiteira'}">${roleLabel}</span>
            </div>
          </div>
          <button class="bb-btn-logout" id="btnNavLogout" title="Sair da Conta (Encerrar Sessão)" aria-label="Sair da Conta">
            ${Icons.logOut ? Icons.logOut(14) : ''}
            <span>Sair</span>
          </button>
        `;
        userArea.style.display = 'flex';

        document.getElementById('btnNavNovaObra')?.addEventListener('click', () => {
          modal.openNovaObraModal({
            fiscalUser: state.user,
            onSave: async (dados) => {
              await state.criarNovaObra(dados);
              toast.success('Obra Cadastrada', `A unidade "${dados.nome}" foi cadastrada com sucesso e vinculada à empreiteira.`);
            }
          });
        });

        document.getElementById('btnNavUserProfile')?.addEventListener('click', () => {
          state.navigate('perfil', 'perfil');
        });

        document.getElementById('btnNavLogout')?.addEventListener('click', () => {
          modal.confirmLogout({
            user: state.user,
            onConfirm: async () => {
              await state.logout();
              toast.info('Sessão Encerrada', 'Você saiu com sucesso da sua conta BBVision.');
            }
          });
        });
      } else {
        // Deslogado
        if (navLinks) navLinks.style.display = page === 'validador-publico' ? 'flex' : 'none';
        userArea.innerHTML = page === 'validador-publico' ? `
          <button class="bb-nav-link" id="btnNavAcessarLogin" style="background: rgba(254, 211, 4, 0.15); color: #FED304; border: 1px solid rgba(254, 211, 4, 0.4); border-radius: 9999px; padding: 6px 14px;">
            <span>🔑</span> Acessar Sistema
          </button>
        ` : '';
        userArea.style.display = page === 'validador-publico' ? 'flex' : 'none';

        document.getElementById('btnNavAcessarLogin')?.addEventListener('click', () => {
          state.navigate('login');
        });
      }
    }

    // Eventos de Navegação dos Links
    document.getElementById('navBrandLogo')?.addEventListener('click', () => {
      if (state.user) state.navigate('inicio', 'inicio');
      else state.navigate('login');
    });

    document.getElementById('navLinkInicio')?.addEventListener('click', () => {
      state.navigate('inicio', 'inicio');
    });

    document.getElementById('navLinkObras')?.addEventListener('click', () => {
      state.navigate('obras', 'obras');
    });

    document.getElementById('navLinkRelatorios')?.addEventListener('click', () => {
      state.navigate('relatorios', 'relatorios');
    });

    document.getElementById('navLinkValidador')?.addEventListener('click', () => {
      state.navigate('validador-publico');
    });

    // Inicia sincronização
    state.subscribe(sincronizarNavbar);
    sincronizarNavbar(state);
  </script>
</body>
</html>
