<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBVision - Fiscalização Remota de Obras | Banco do Brasil</title>
  
  <!-- Favicon Oficial BBVision -->
  <link rel="icon" type="image/png" href="src/assets/logo.png">
  
  <!-- Tipografia Oficial: Plus Jakarta Sans (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Folhas de Estilo do Design System BBVision (v2.0 Produção) -->
  <link rel="stylesheet" href="src/styles/variables.css?v=2.0">
  <link rel="stylesheet" href="src/styles/base.css?v=2.0">
  <link rel="stylesheet" href="src/styles/components.css?v=2.0">
  <link rel="stylesheet" href="src/styles/screens.css?v=2.0">
</head>
<body>

  <!-- Barra Superior Corporativa Oficial (Banco do Brasil) -->
  <header class="bb-navbar" id="appNavbar">
    <div class="bb-navbar-brand" id="navBrandLogo">
      <div class="bb-navbar-logo-wrap">
        <img src="src/assets/logo.png" alt="BBVision" class="bb-navbar-logo">
      </div>
      <div class="bb-navbar-titles">
        <span class="bb-navbar-title">BBVision</span>
        <span class="bb-navbar-sub">Banco do Brasil S.A. • Fiscalização de Obras</span>
      </div>
    </div>

    <!-- Navegação Central da Aplicação -->
    <nav class="bb-navbar-nav" id="mainNavigationLinks">
      <button class="bb-nav-link" id="navLinkInicio">
        <span>📊</span> Visão Geral
      </button>
      <button class="bb-nav-link" id="navLinkObras">
        <span>📁</span> Obras
      </button>
      <button class="bb-nav-link" id="navLinkRelatorios">
        <span>📑</span> Relatórios
      </button>
      <button class="bb-nav-link highlight-gov" id="navLinkValidador">
        <span>🛡️</span> Validar Fé Pública
      </button>
    </nav>

    <!-- Área de Usuário / Acesso à Direita -->
    <div class="bb-navbar-user-area" id="navbarUserArea">
      <!-- Injetado dinamicamente via script de autenticação -->
    </div>
  </header>

  <!-- Viewport Principal da Aplicação -->
  <main class="bb-app-main">
    <div class="app-screen-container" id="appScreenContainer">
      <!-- Telas injetadas dinamicamente via app.js -->
    </div>

    <!-- Barra Inferior de Navegação Móvel (Mobile Only) -->
    <div id="bottomNavSlot"></div>
  </main>

  <!-- Script Principal da Aplicação -->
  <script type="module" src="src/app.js"></script>

  <!-- Sincronização da Navbar com o Estado de Autenticação -->
  <script type="module">
    import { state } from './src/services/state.js';

    function sincronizarNavbar(s) {
      const user = s.user;
      const userArea = document.getElementById('navbarUserArea');
      const navLinks = document.getElementById('mainNavigationLinks');
      const page = s.currentPage;

      // Atualiza links ativos
      document.querySelectorAll('.bb-nav-link').forEach(btn => btn.classList.remove('active'));
      if (page === 'inicio') document.getElementById('navLinkInicio')?.classList.add('active');
      if (page === 'obras' || page === 'obra-detalhe') document.getElementById('navLinkObras')?.classList.add('active');
      if (page === 'relatorios' || page === 'relatorio-bloqueado') document.getElementById('navLinkRelatorios')?.classList.add('active');
      if (page === 'validador-publico') document.getElementById('navLinkValidador')?.classList.add('active');

      if (user) {
        if (navLinks) navLinks.style.display = 'flex';
        userArea.innerHTML = '';
        userArea.style.display = 'none';
      } else {
        // Deslogado
        if (navLinks) navLinks.style.display = page === 'validador-publico' ? 'flex' : 'none';
        userArea.innerHTML = '';
        userArea.style.display = 'none';
      }
    }

    // Eventos de Navegação dos Links
    document.getElementById('navBrandLogo')?.addEventListener('click', () => {
      if (state.user) state.navigate('inicio', 'inicio');
      else state.navigate('login');
    });

    document.getElementById('navLinkInicio')?.addEventListener('click', () => {
      state.navigate('inicio', 'inicio');
    });

    document.getElementById('navLinkObras')?.addEventListener('click', () => {
      state.navigate('obras', 'obras');
    });

    document.getElementById('navLinkRelatorios')?.addEventListener('click', () => {
      state.navigate('relatorios', 'relatorios');
    });

    document.getElementById('navLinkValidador')?.addEventListener('click', () => {
      state.navigate('validador-publico');
    });

    // Inicia sincronização
    state.subscribe(sincronizarNavbar);
    sincronizarNavbar(state);
  </script>
</body>
</html>
